<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Campo de Flores</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Toca una flor 🌸</h1>
    <p>Descubre los mensajes y fotos ocultos.</p>
  </header>

  <main id="garden" class="garden" aria-live="polite">
    <!-- Las "flores" se generan desde app.js -->
  </main>

  <!-- Modal -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"
       aria-hidden="true" aria-labelledby="modal-title" aria-describedby="modal-text">
    <div class="modal-content" role="document">
      <button id="close-btn" class="close-btn" aria-label="Cerrar diálogo">✕</button>
      <h2 id="modal-title" class="visually-hidden">Información de la flor</h2>
      <img id="modal-img" class="modal-img hidden" alt="">
      <p id="modal-text"></p>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
